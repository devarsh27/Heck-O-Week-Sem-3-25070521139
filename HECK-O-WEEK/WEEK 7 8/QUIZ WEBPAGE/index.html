<!DOCTYPE html>
<html>
<head>
<title>3D Quiz Challenge</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="background-overlay"></div>

<div class="background-blur"></div>

<h1 class="title">🎮  Quiz Race </h1>

<!-- Motivational Character -->
<div class="character">
<div class="robot">🤖</div>
<p id="motivation">Let's start the quiz! You can do it!</p>
</div>

<div class="quiz-container">

<div class="level">Level : <span id="level">1</span></div>

<div class="question-card">

<h2 id="question"></h2>

<div class="options">
<button class="option" onclick="checkAnswer(0)"></button>
<button class="option" onclick="checkAnswer(1)"></button>
<button class="option" onclick="checkAnswer(2)"></button>
<button class="option" onclick="checkAnswer(3)"></button>
</div>

</div>

<button id="nextBtn" onclick="nextQuestion()">Next Question</button>

</div>

<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
